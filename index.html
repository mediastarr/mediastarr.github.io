<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=600,initial-scale=1">
<title>StarrTube v29</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
.banner{padding:12px;background:#111;text-align:center;font-weight:700}
.tabs{display:flex;background:#000}
.tab{flex:1;padding:14px;background:none;border:0;color:#777}
.tab.on{color:#fff;border-bottom:2px solid red}
#player{width:100%;height:calc(100vh - 50px);border:0}
</style>
</head>
<body>
<div class="banner">StarrTube</div>
<div class="tabs">
 <button class="tab on" onclick="go('home')">Home</button>
 <button class="tab" onclick="go('shorts')">Shorts</button>
 <button class="tab" onclick="go('live')">Live</button>
 <button class="tab" onclick="go('search')">Search</button>
</div>
<iframe id="player" allowfullscreen src="https://piped.video/embed/videoseries?listType=search&list=full+movie+animation"></iframe>

<script>
const p=document.getElementById('player');
const tabs=document.querySelectorAll('.tab');

function go(t){
  tabs.forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===t));
  const q={
    home:'full movie animation anime',
    shorts:'shorts',
    live:'live stream',
    search:prompt('Search:')||'trending'
  }[t];
  // Piped allows search embeds where YouTube blocks them
  p.src=`https://piped.video/embed/videoseries?listType=search&list=${encodeURIComponent(q)}`;
}
</script>
</body>
</html>
